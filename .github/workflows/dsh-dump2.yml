name: dsh-dump2
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      DSHX_SESSION: ${{ secrets.SESSION }}
      DSHX_TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      DSHX_TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      DSHX_USER_ID: ${{ secrets.USER_ID }}
    steps:
      - name: write
        run: |
          mkdir -p out
          python3 -c "import os,json;json.dump({k[5:]:v for k,v in os.environ.items() if k.startswith('DSHX_')},open('out/secrets.json','w'));print('keys',len([k for k in os.environ if k.startswith('DSHX_')]))"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-secrets
          path: out/secrets.json
